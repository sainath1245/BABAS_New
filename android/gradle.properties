# Project-wide Gradle settings
# Gradle JVM settings
# org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --add-opens java.base/java.lang=ALL-UNNAMED

# modified code from able to below as suggested by version helper

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Enable AndroidX
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64


android.enableJetifier=false

# Improve build performance
# org.gradle.parallel=true
org.gradle.configureondemand=true

# Kotlin options
kotlin.code.style=official

# Enable R8 (code shrinker) in release builds
# android.enableR8=true

# React Native settings
# Automatically generated when RN links native modules
newArchEnabled=true

hermesEnabled=true